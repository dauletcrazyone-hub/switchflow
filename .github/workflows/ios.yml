# Builds the iOS companion on a GitHub-hosted Mac, runs its unit tests in the iPhone
# simulator and captures screenshots. No Apple Developer account is needed for this:
# simulator builds are unsigned.
name: iOS

on:
  push:
    paths: ["ios/**", "desktop/src-tauri/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "desktop/src-tauri/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build and run unit tests
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild test \
            -project SwitchFlowCompanion.xcodeproj \
            -scheme SwitchFlowCompanion \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | grep -E "error:|warning:|Test Case|Executed|BUILD|\*\* " || true
          # grep above only filters the console; the real exit code is xcodebuild's.
          test "${PIPESTATUS[0]}" -eq 0

      - name: Summarise compiler errors
        if: failure()
        run: |
          {
            echo "## Compiler errors"
            echo '```'
            grep -E "error:" build/xcodebuild.log | sort -u | head -80 || echo "no 'error:' lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Screenshots in the simulator
        if: success()
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find build/DerivedData/Build/Products -path "*iphonesimulator*" -name "SwitchFlowCompanion.app" | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          for lang in ru en; do
            xcrun simctl terminate "$UDID" app.switchflow.companion || true
            xcrun simctl launch "$UDID" app.switchflow.companion -AppleLanguages "($lang)" -AppleLocale "${lang}_RU"
            sleep 8
            xcrun simctl io "$UDID" screenshot "build/welcome-$lang.png"
          done

      # A real-device build without a signature. Sideloadly / AltStore sign it with the user's
      # own Apple ID on the PC (docs/INSTALL_IPHONE.md). Release: the debug test hooks are not in it.
      - name: Unsigned .ipa for a real iPhone
        if: success()
        run: |
          set -o pipefail
          xcodebuild build -project SwitchFlowCompanion.xcodeproj -scheme SwitchFlowCompanion -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -3
          APP=build/Device/Build/Products/Release-iphoneos/SwitchFlowCompanion.app
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          IPA="SwitchFlow-$VERSION-unsigned.ipa"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry "../$IPA" Payload)
          {
            echo "## Unsigned .ipa"
            echo '```'
            echo "$IPA  $(du -h "build/$IPA" | cut -f1)"
            lipo -info "$APP/SwitchFlowCompanion"
            /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" -c "Print MinimumOSVersion" "$APP/Info.plist"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The debug-only pairing hook must not ship.
          if grep -qa "SFPairingURI" "$APP/SwitchFlowCompanion"; then echo "debug hook found in the Release build"; exit 1; fi

      - name: Upload the .ipa
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: ios/build/SwitchFlow-*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-results
          path: |
            ios/build/xcodebuild.log
            ios/build/*.png
            ios/build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

  # The iOS app in the simulator talks to the real SwitchFlow core (the same Rust code as the
  # Windows app) over real TLS on this Mac: iPhone → PC backup, PC → iPhone restore, repeat restore.
  e2e:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build the SwitchFlow core test host
        working-directory: desktop/src-tauri
        run: cargo build --example ios_e2e_host

      - name: Build the iOS app for the simulator
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          set -o pipefail
          # The app (Debug) plus the UI-test driver that plays the person holding the phone.
          xcodebuild build-for-testing -project SwitchFlowCompanion.xcodeproj -scheme SwitchFlowE2E \
            -destination "id=$UDID" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tail -3

      - name: Prepare the simulator (photos, permissions)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q pillow
          "$RUNNER_TEMP/venv/bin/python" ios/ci/make_fixtures.py "$RUNNER_TEMP/fixtures"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find ios/build/DerivedData/Build/Products -path "*iphonesimulator*" -name "SwitchFlowCompanion.app" | head -1)
          xcrun simctl install "$UDID" "$APP"
          # Pre-grant what simctl can; the UI-test driver taps whatever dialog still appears
          # (full Photos access is not pre-granted on iOS 26 simulators).
          # "photos" (full access) goes last: a later "photos-add" would downgrade it to add-only.
          for service in all contacts calendar photos; do
            xcrun simctl privacy "$UDID" grant "$service" app.switchflow.companion || echo "grant $service not supported"
          done
          xcrun simctl addmedia "$UDID" "$RUNNER_TEMP"/fixtures/expect/*.jpg

      - name: Run the end-to-end test
        run: |
          OUT="$RUNNER_TEMP/e2e"
          mkdir -p "$OUT"
          ./desktop/src-tauri/target/debug/examples/ios_e2e_host --out "$OUT" \
            --expect-photos "$RUNNER_TEMP/fixtures/expect" --restore-photos "$RUNNER_TEMP/fixtures/restore" \
            > "$OUT/host.log" 2>&1 &
          HOST=$!
          for i in $(seq 60); do [ -f "$OUT/pair-uri.txt" ] && break; sleep 1; done
          # The driver opens the app with the QR code's content (debug builds accept it as a
          # launch argument) and answers permission dialogs until the PC side is done.
          # TEST_RUNNER_X reaches the test as X.
          export TEST_RUNNER_SF_PAIRING_URI="$(cat "$OUT/pair-uri.txt")"
          export TEST_RUNNER_SF_DONE_FILE="$OUT/done"
          (cd ios && xcodebuild test-without-building -project SwitchFlowCompanion.xcodeproj -scheme SwitchFlowE2E \
            -destination "id=$UDID" -derivedDataPath build/DerivedData -resultBundlePath "$OUT/E2E.xcresult" \
            CODE_SIGNING_ALLOWED=NO > "$OUT/driver.log" 2>&1) &
          DRIVER=$!
          i=0
          while kill -0 "$HOST" 2>/dev/null; do
            i=$((i + 1))
            [ "$i" -le 60 ] && xcrun simctl io "$UDID" screenshot "$OUT/shot-$(printf %02d "$i").png" >/dev/null 2>&1
            sleep 6
          done
          wait "$HOST" && STATUS=0 || STATUS=$?
          xcrun simctl io "$UDID" screenshot "$OUT/shot-final.png" >/dev/null 2>&1 || true
          touch "$OUT/done"
          for i in $(seq 60); do kill -0 "$DRIVER" 2>/dev/null || break; sleep 1; done
          kill "$DRIVER" 2>/dev/null || true
          grep "SF-E2E\|error:\|Test Case" "$OUT/driver.log" || tail -30 "$OUT/driver.log"
          cat "$OUT/host.log"
          {
            echo "## iOS ↔ SwitchFlow core end-to-end"
            echo '```'
            tail -40 "$OUT/host.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Collect the iOS app log
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show --last 30m --style compact --info --debug \
            --predicate 'process == "SwitchFlowCompanion"' > "$RUNNER_TEMP/e2e/app.log" 2>&1 || true
          find "$RUNNER_TEMP/e2e/Documents" -name switchflow-backup.json -exec cp {} "$RUNNER_TEMP/e2e/" \; 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*.png
            ${{ runner.temp }}/e2e/*.json
            ${{ runner.temp }}/e2e/E2E.xcresult
          if-no-files-found: ignore
          retention-days: 14
