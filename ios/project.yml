# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen` → SwitchFlowCompanion.xcodeproj
name: SwitchFlowCompanion
options:
  bundleIdPrefix: app.switchflow
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here or in Xcode › Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SwitchFlowCompanion:
    type: application
    platform: iOS
    sources:
      - path: SwitchFlowCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.switchflow.companion
        INFOPLIST_FILE: SwitchFlowCompanion/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
  SwitchFlowCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwitchFlowCompanionTests
    dependencies:
      - target: SwitchFlowCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.switchflow.companion.tests
  # Cloud end-to-end driver: opens the app and answers system permission dialogs.
  SwitchFlowE2E:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SwitchFlowE2E
    dependencies:
      - target: SwitchFlowCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.switchflow.companion.e2e
        TEST_TARGET_NAME: SwitchFlowCompanion
schemes:
  SwitchFlowCompanion:
    build:
      targets:
        SwitchFlowCompanion: all
        SwitchFlowCompanionTests: [test]
    test:
      targets:
        - SwitchFlowCompanionTests
  SwitchFlowE2E:
    build:
      targets:
        SwitchFlowCompanion: all
        SwitchFlowE2E: [test]
    test:
      config: Debug
      targets:
        - SwitchFlowE2E
